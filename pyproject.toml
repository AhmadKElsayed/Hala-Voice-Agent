[project]
name = "hala-voice-agent"
version = "0.1.0"
description = "Hala — voice/text assistant for the Public Prosecution inmate-services kiosk (LiveKit Agents)"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[openai,silero,speechmatics]~=1.6",
    "livekit-plugins-ai-coustics~=0.3",
    "livekit-api>=1.0",
    "openai>=1.60",
    "httpx>=0.27",
    "python-dotenv",
    "pyyaml",
    # mock backend only
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "."]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # long lines; Arabic text trips the ambiguous-character rules

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
